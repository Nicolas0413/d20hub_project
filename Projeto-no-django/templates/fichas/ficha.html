<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% load static %}
  <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
  <title>D20HUB</title>
  <link rel="stylesheet" href="{% static 'css/ficha.css' %}?v=1.1">
  <script src="{% static 'js/ficha.js' %}?v=1.1" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <script>
    window.csrftoken = '{{ csrf_token }}';
  </script>
</head>

<body>
  <div class="sheet" data-id="{{ ficha.id }}">
    <header>
      <div style="margin-bottom: 10px; text-align: center;">
        <a class="btn btn-outline-primary" href="{% url 'fichas:ler_ficha' ficha.id %}">Ficha</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:pericias_ficha' ficha.id %}">Pericias</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:habilidades_ficha' ficha.id %}">Habilidades</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:inventario_ficha' ficha.id %}">Inventário</a>
        <a class="btn btn-outline-primary" href="{% url 'fichas:detalhes_ficha' ficha.id %}">Detalhes</a>
      </div>
      <div class="top">
        <div class="image-wrapper">
          <img src="{{ ficha.foto_personagem.url }}" data-save="foto_personagem" class="photo" id="charImage">
          <input type="file" id="imageInput" accept="image/*" hidden data-save="foto_personagem">
        </div>
        <div class="info">
          <div class="name-row">
            <input class="editable name" disabled value="{{ ficha.personagem }}" data-save="personagem">
            <button class="edit-icon" id="editBtn" onclick="editar()">
              <i class="bi bi-pencil-square"></i>
            </button>
          </div>
          <div class="level">
            <span title="Nex">Nex</span><input class="editable" disabled value="{{ ficha.nex }}" data-save="nex" style="width: 30px;">% &nbsp&nbsp&nbsp&nbsp
            Classe:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.classe }}" data-save="classe">    
          </div>
          <div class="level">
            Trilha:<input class="editable" disabled style="width:80px; font-size: 14px; text-align: left;" value="{{ ficha.trilha }}" data-save="trilha">
            Origem:<input class="editable" disabled style="width:89px; font-size: 14px; text-align: left;" value="{{ ficha.origem }}" data-save="origem">
          </div>
        </div>
      </div>
    </header>



    <div class="attributes">
    <div class="attr" title="Força">FOR<input class="editable" value="{{ ficha.estatisticas.forca }}" disabled type="number" data-save="estatisticas.forca"></div>
    <div class="attr" title="Agilidade">AGI<input class="editable" value="{{ ficha.estatisticas.agilidade }}" disabled type="number" data-save="estatisticas.agilidade"></div>
    <div class="attr" title="Intelecto">INT<input class="editable" value="{{ ficha.estatisticas.intelecto }}" disabled type="number" data-save="estatisticas.intelecto"></div>
    <div class="attr" title="Presença">PRE<input class="editable" value="{{ ficha.estatisticas.presenca }}" disabled type="number" data-save="estatisticas.presenca"></div>
    <div class="attr" title="Vigor">VIG<input class="editable" value="{{ ficha.estatisticas.vigor }}" disabled type="number" data-save="estatisticas.vigor"></div>
  </div>


  <div class="section">
    <div class="label">VIDA</div>
    <div class="stat">
      <input class="editable" disabled id="pvAtual" type="number" value="{{ ficha.estatisticas.pv_atual }}" data-save="estatisticas.pv_atual" style="width:60px;"> <!-- oninput="updateBar('pv')" -->
      /
      <input class="editable" disabled id="pvMax" type="number" value="{{ ficha.estatisticas.pv_maximos }}" data-save="estatisticas.pv_maximos" style="width: 60px; text-align: right;"> <!-- oninput="updateBar('pv')" -->
    </div>
    <div class="bar-bg"><div class="bar" id="pvBar"></div></div>
  </div>

  <div class="section">
    <div class="label">DETERMINAÇÃO</div>
    <div class="stat">
      <input class="editable" disabled id="detAtual" type="number" value="{{ ficha.estatisticas.pe_atual }}" data-save="estatisticas.pe_atual" style="width:60px;"> <!-- oninput="updateBar('det')" -->
      /
      <input class="editable" disabled id="detMax" type="number" value="{{ ficha.estatisticas.pe_maximos }}" data-save="estatisticas.pe_maximos" style="width:60px; text-align: right;"> <!-- oninput="updateBar('det')" -->
    </div>
    <div class="bar-bg"><div class="bar" id="detBar"></div></div>
  </div>

  <div class="section defenses">
    <div>
      <div class="label">DEFESA</div>
      <input class="editable" disabled type="number" value="{{ ficha.estatisticas.defesa }}" data-save="estatisticas.defesa">
    </div>
    <div>
      <div class="label">ESQUIVA</div>
      <input class="editable" disabled type="number" value="{{ ficha.estatisticas.esquiva }}" data-save="estatisticas.esquiva">
    </div>
    <div>
      <div class="label">BLOQUEIO</div>
      <input class="editable" disabled type="number" value="{{ ficha.estatisticas.bloqueio }}" data-save="estatisticas.bloqueio">
    </div>
  </div>


  <div class="section">
    <div>
      <table width="100%">
        <td class="list" width="111.68">Ataque</td>
        <td class="list" width="111.68">Dano</td>
        <td class="listend" width="111.68">Crítico</td>
      </table>  
    </div>
    <div class="attacks" id="attacks">

      {% for ataque in ficha.ataques.all %} 
        <div class="attack-row">
          <input class="editable attack-name naoficha" disabled value="{{ ataque.nome }}" data-save="attackName{{ forloop.counter }}">
          <input class="editable attack-damage naoficha" disabled value="{{ ataque.dano }}" data-save="attackDamage{{ forloop.counter }}">
          <input class="editable attack-critical naoficha" disabled value="{{ ataque.critico }}" data-save="attackCritical{{ forloop.counter }}">
        </div>
      {% endfor %}

    </div>
    <button class="edit-btn">Adicionar ataque</button> <!-- onclick="addAttack()" -->
  </div>

  <button class="btn btn-success export"> <!-- onclick="exportFichaCSV()" -->
    <i class="bi bi-download"></i> Exportar Ficha
  </button>

  <input type="file" id="importCSV" accept=".csv" hidden class="naoficha">
  <button class="btn btn-primary import"> <!-- onclick="document.getElementById('importCSV').click()" -->
    <i class="bi bi-upload"></i> Importar Ficha
  </button>

  <a href="../" class="ama"><button class="btn" id="retornar">Retornar</button></a>

  <div class="dice-control">

    <input id="diceQtd" class="naoficha" value="1" min="1" style="width:20px;">

    <select class="dice naoficha" id="diceType" data-save="dice">
      <option value="4">d4</option>
      <option value="6">d6</option>
      <option value="8" selected>d8</option>
      <option value="10">d10</option>
      <option value="12">d12</option>
      <option value="20">d20</option>
      <option value="100">d100</option>
    </select>


    +<input id="diceBonus"  value="0" style="width:35px;" title="Bônus" class="naoficha">


    <button class="dice"> <!-- onclick="rollFromInputs()" -->
      <i class="bi bi-dice-6"></i> 
    </button>

  </div>

  <div id="dice-result" class="dice-result"></div>
  </div>
</body>

</html>
