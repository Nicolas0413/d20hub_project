<html>
<head>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!--bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--bootstrap javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/sala_rpg.css' %}">
    <script src="{% static 'js/sala_rpg.js' %}?v=9999.12" defer></script>
</head>
<body>
    <div class="accordion accordion-custom" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#ficha{{ ficha.id }}" aria-expanded="false" aria-controls="ficha{{ ficha.id }}">
                    <div class="item-row" style="width:100%">
                        <p>Ficha: {{ ficha.nome }}</p>
                        <p>Usuário: {{ ficha.usuario }}</p>
                        {% if request.user == ficha.usuario %}
                            <p>Visibilidade: 
                                <form method="post" class="d-inline-block">
                                    {% csrf_token %}
                                    <select data-id="{{ ficha.id }}" class="form-select form-select-sm d-inline-block w-auto" 
                                            onclick="event.stopPropagation()" 
                                            onchange="alterarVisibilidade(this.dataset.id, this.value)">
                                        <option value="3" {% if ficha.visibilidade == 3 %}selected{% endif %}>Pública</option>
                                        <option value="2" {% if ficha.visibilidade == 2 %}selected{% endif %}>Sala</option>
                                        <option value="1" {% if ficha.visibilidade == 1 %}selected{% endif %}>Mestre</option>
                                        <option value="0" {% if ficha.visibilidade == 0 %}selected{% endif %}>Privada</option>
                                    </select>
                                </form>
                            </p>
                        {% else %}
                            <p>Visibilidade: {{ ficha.visibilidade }}</p>
                        {% endif %}
                    </div>
                </button>
            </h2>
            <div id="ficha{{ ficha.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                <div class="accordion-body">
                    <p>Link para a ficha: <a href="{% url 'fichas:ler' ficha_id=ficha.id categoria='ficha' %}">{{ ficha.nome }}</a></p>
                    <button class="remove-item" data-item-id="{{ ficha.id }}">
                        Descarregar ficha
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
