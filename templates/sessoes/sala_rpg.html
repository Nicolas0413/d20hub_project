<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="{% static 'img/d20hub.ico' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!--bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--bootstrap icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--bootstrap javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'css/sala_rpg.css' %}">
    <script>
        const selecionarFichaUrl = "{% url 'sessoes:selecionar_ficha' %}";
    </script>
    <script src="{% static 'js/sala_rpg.js' %}?v=9999.12" defer></script>
    <title>Sala</title>
</head>
<body>
    <a href="{% url 'sessoes:entrar_sala' %}">Voltar</a>
    <h1>Mesa de RPG</h1>
    <input type="hidden" id="codigo-sala" value="{{ sala.codigo }}">
    <form id="form">
        <input type="text" name="mensagem" id="mensagem" placeholder="Digite sua mensagem...">
        <input type="submit" value="Enviar">
    </form>
    <div id="mensagens"></div>
    <div id="fichas">
        <button type="button" class="edit-btn" onclick="adicionarFicha()">Adicionar ficha</button>
    </div>
</body>
</html>
